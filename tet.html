<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ملزمة اللغة الإنجليزية — الأستاذ أحمد إبراهيم</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;background:#0d1b4e;}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-track{background:rgba(255,255,255,.1);}
::-webkit-scrollbar-thumb{background:rgba(255,215,0,.6);border-radius:3px;}
button{font-family:inherit;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const AUTHOR="الأستاذ أحمد إبراهيم";
const C={navy:"#0d1b4e",blue:"#1565c0",teal:"#00796b",red:"#c62828",gold:"#ffc107",
  green:"#2e7d32",purple:"#6a1b9a",orange:"#e65100",pink:"#c2185b",
  indigo:"#283593",brown:"#5d4037",muted:"#6b7280"};

// ── Atoms ──────────────────────────────────────────────────────────────────
const Ex=({en,ar,color=C.green})=>(
  <div style={{background:"#f1f8e9",borderRight:`4px solid ${color}`,borderRadius:8,padding:"6px 11px",margin:"5px 0"}}>
    <div style={{direction:"ltr",textAlign:"left",color,fontWeight:700,fontSize:12}}>► {en}</div>
    {ar&&<div style={{color:C.muted,fontSize:11,marginTop:2,textAlign:"right"}}>◄ {ar}</div>}
  </div>);

const Tip=({children,icon="💡",bc="#f9a825"})=>(
  <div style={{background:"#fff8e1",borderRight:`4px solid ${bc}`,borderRadius:9,
    padding:"8px 12px",margin:"7px 0",display:"flex",gap:7,alignItems:"flex-start",direction:"rtl"}}>
    <span style={{fontSize:15,flexShrink:0}}>{icon}</span>
    <div style={{fontSize:12,color:"#795548",fontWeight:600,lineHeight:1.8}}>{children}</div>
  </div>);

const Fm=({text,color=C.navy})=>(
  <div style={{background:"#f0f4ff",border:`2px solid ${color}22`,borderRadius:8,
    padding:"7px 12px",fontFamily:"monospace",fontSize:12,color,
    fontWeight:700,direction:"ltr",textAlign:"left",margin:"6px 0"}}>{text}</div>);

const Quiz=({qs,accent=C.blue})=>{
  const [sel,setSel]=useState({});
  const [done,setDone]=useState(false);
  const [score,setScore]=useState(null);
  const check=()=>{let s=0;qs.forEach((q,i)=>{if(sel[i]===q.a)s++;});setScore(s);setDone(true);};
  const reset=()=>{setSel({});setDone(false);setScore(null);};
  return(
    <div style={{marginTop:8}}>
      {qs.map((q,i)=>(
        <div key={i} style={{background:"#fff",borderRadius:9,padding:"10px 13px",
          marginBottom:8,border:"1.5px solid #e0e7ff",boxShadow:"0 1px 4px rgba(0,0,0,.05)"}}>
          <div style={{fontWeight:700,color:C.navy,marginBottom:7,fontSize:12,direction:"ltr",textAlign:"left"}}>
            <span style={{background:accent,color:"#fff",borderRadius:"50%",width:20,height:20,
              display:"inline-flex",alignItems:"center",justifyContent:"center",
              fontSize:10,fontWeight:900,marginRight:6}}>{i+1}</span>
            {q.q}
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",direction:"ltr"}}>
            {q.opts.map(o=>{
              const picked=sel[i]===o,correct=done&&o===q.a,wrong=done&&picked&&o!==q.a;
              return(
                <button key={o} onClick={()=>!done&&setSel(s=>({...s,[i]:o}))}
                  style={{padding:"4px 12px",borderRadius:16,border:"2px solid",
                    borderColor:correct?C.green:wrong?C.red:picked?accent:"#d1d5db",
                    background:correct?"#dcfce7":wrong?"#fee2e2":picked?"#dbeafe":"#f9fafb",
                    color:correct?"#166534":wrong?"#991b1b":picked?C.navy:"#374151",
                    fontWeight:700,fontSize:11,cursor:done?"default":"pointer",transition:"all .15s"}}>{o}</button>
              );})}
          </div>
          {done&&sel[i]!==q.a&&<div style={{color:C.green,fontSize:11,marginTop:4,fontWeight:700}}>✅ الإجابة: {q.a}</div>}
        </div>))}
      <div style={{display:"flex",gap:7,marginTop:4}}>
        <button onClick={check} disabled={done} style={{padding:"7px 18px",borderRadius:18,border:"none",
          background:done?"#9ca3af":accent,color:"#fff",fontWeight:800,fontSize:12,cursor:done?"default":"pointer"}}>تحقق ✓</button>
        <button onClick={reset} style={{padding:"7px 18px",borderRadius:18,border:`2px solid ${accent}`,
          background:"transparent",color:accent,fontWeight:800,fontSize:12,cursor:"pointer"}}>🔄 إعادة</button>
      </div>
      {score!==null&&(
        <div style={{marginTop:8,padding:"9px 14px",borderRadius:9,fontWeight:800,fontSize:13,textAlign:"center",color:C.navy,
          background:score===qs.length?"#dcfce7":score>=qs.length/2?"#fef9c3":"#fee2e2",
          border:`2px solid ${score===qs.length?C.green:score>=qs.length/2?C.gold:C.red}`}}>
          {score===qs.length?"🏆 ممتاز! كل الإجابات صحيحة!":score===0?"💪 حاول مجدداً!":
            `👍 ${score}/${qs.length} إجابة صحيحة`}
        </div>)}
    </div>);};

const Card=({icon,ar,en,color,children,open:initOpen=true})=>{
  const [open,setOpen]=useState(initOpen);
  return(
    <div style={{borderRadius:14,overflow:"hidden",boxShadow:"0 4px 18px rgba(0,0,0,.1)",marginBottom:18,border:`2px solid ${color}22`}}>
      <div onClick={()=>setOpen(o=>!o)} style={{background:`linear-gradient(135deg,${color},${color}bb)`,
        padding:"11px 16px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <span style={{fontSize:22}}>{icon}</span>
          <div>
            <div style={{color:"#fff",fontWeight:900,fontSize:15}}>{ar}</div>
            <div style={{color:"rgba(255,255,255,.8)",fontSize:11}}>{en}</div>
          </div>
        </div>
        <span style={{color:"#fff",fontSize:18}}>{open?"▲":"▼"}</span>
      </div>
      {open&&<div style={{background:"#f8faff",padding:"14px 16px"}}>{children}</div>}
    </div>);};

const G3=({items})=>(
  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7,margin:"9px 0"}}>
    {items.map(({label,val,bg,bc})=>(
      <div key={label} style={{background:bg,border:`2px solid ${bc}`,borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
        <div style={{color:bc,fontWeight:900,fontSize:11,marginBottom:3}}>{label}</div>
        <div style={{fontFamily:"monospace",fontSize:10,color:"#333",direction:"ltr",whiteSpace:"pre-line"}}>{val}</div>
      </div>))}</div>);

const Tbl=({cols,rows,colColors})=>(
  <div style={{overflowX:"auto",borderRadius:8,boxShadow:"0 2px 7px rgba(0,0,0,.08)",margin:"8px 0"}}>
    <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
      <thead><tr>{cols.map((c,i)=>(
        <th key={c} style={{background:colColors?.[i]||C.navy,color:"#fff",padding:"7px 9px",textAlign:"center"}}>{c}</th>
      ))}</tr></thead>
      <tbody>{rows.map((r,i)=>(
        <tr key={i} style={{background:i%2===0?"#f8faff":"#fff"}}>
          {r.map((c,j)=><td key={j} style={{padding:"6px 9px",textAlign:"center",border:"1px solid #e5e7eb",direction:"ltr",fontWeight:j===0?700:400}}>{c}</td>)}
        </tr>))}</tbody>
    </table></div>);

const OppGrid=({pairs})=>(
  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,margin:"8px 0"}}>
    {pairs.map(([a,b])=>(
      <div key={a} style={{display:"flex",borderRadius:6,overflow:"hidden",border:"1.5px solid #e0e7ff"}}>
        <div style={{background:C.teal,color:"#fff",padding:"5px 9px",fontWeight:700,fontSize:11,flex:1,textAlign:"center"}}>{a}</div>
        <div style={{background:"#e0f2f1",color:C.teal,padding:"5px 9px",fontWeight:700,fontSize:11,flex:1,textAlign:"center"}}>{b}</div>
      </div>))}</div>);

const MF=({items})=>(
  <div style={{marginTop:7}}>
    {items.map(({m,f,n},i)=>(
      <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",
        background:f?"#e8f5e9":"#ffebee",border:`1.5px solid ${f?C.green:C.red}`,
        borderRadius:7,padding:"7px 10px",marginBottom:5,direction:"ltr"}}>
        <span style={{fontSize:16,flexShrink:0}}>{f?"✅":"❌"}</span>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:"#333"}}>{m}</div>
          <div style={{fontSize:10,color:C.muted}}>{n}</div>
        </div>
      </div>))}</div>);

// ── Unit metadata ─────────────────────────────────────────────────────────
const UNITS=[
  {id:1,label:"📘 Unit One",  color:C.blue,  sub:"وصف المكان، الساعة، الأزمنة المستمرة"},
  {id:2,label:"📗 Unit Two",  color:C.teal,  sub:"المضارع البسيط، الهوايات، الاقتراح"},
  {id:3,label:"📙 Unit Three",color:C.orange,sub:"المقارنة والتفضيل، الشرطية if"},
  {id:4,label:"📕 Unit Four", color:C.red,   sub:"الحياة البرية، قصة إبراهيم، while/when"},
  {id:5,label:"📓 Unit Five", color:C.purple,sub:"قصة نوال، الكتابة، البرامج التلفزيونية"},
  {id:6,label:"📔 Unit Six",  color:C.brown, sub:"الوظائف، مدرسة المستقبل، الملخص الشامل"},
];
const U1=[{icon:"📍",label:"وصف المكان"},{icon:"🕐",label:"الساعة"},{icon:"⏱️",label:"المضارع المستمر"},
  {icon:"🕰️",label:"الماضي المستمر"},{icon:"🚗",label:"Car of the Year"},
  {icon:"🔤",label:"الصفات والمضادات"},{icon:"💬",label:"Give Reason & Polite"},{icon:"📖",label:"القصة والملخص"}];
const U2=[{icon:"🎯",label:"المضارع البسيط"},{icon:"🎭",label:"أفعال الرغبة"},
  {icon:"💡",label:"الاقتراح والدعوة"},{icon:"📧",label:"الإيميل والهواية"},{icon:"📺",label:"البرامج والقراءات"}];
const U3=[{icon:"📊",label:"المقارنة والتفضيل"},{icon:"↔️",label:"as...as والقبول/الرفض"},
  {icon:"🔀",label:"الشرطية If"},{icon:"🦅",label:"The Fastest Living Things"}];
const U4=[{icon:"🌿",label:"الحياة البرية"},{icon:"🧑",label:"قصة إبراهيم"},
  {icon:"⏰",label:"While / When / As"},{icon:"📰",label:"Iraqi Morning News"}];
const U5=[{icon:"👩‍⚕️",label:"قصة نوال"},{icon:"📝",label:"Write about your life"},
  {icon:"📺",label:"TV Program — Blue Whale"},{icon:"📰",label:"Story 3 — A Powerful Lesson"}];
const U6=[{icon:"👔",label:"الوظائف — Jobs"},{icon:"🏫",label:"مدرسة المستقبل"},
  {icon:"🌍",label:"الملخص الشامل"}];
const UNIT_TABS=[U1,U2,U3,U4,U5,U6];

// ══ UNIT 1 ══════════════════════════════════════════════════════════════════
function RenderU1({tab}){switch(tab){
case 0:return(<>
  <Card icon="📍" ar="وصف المكان" en="Describing Place" color={C.blue}>
    <Tip>نصف المكان باستخدام <strong>there is / there are</strong> للتعبير عن وجود شيء في مكان ما</Tip>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:11}}>
      <div style={{background:"#e3f2fd",border:`2px solid ${C.blue}`,borderRadius:10,padding:11}}>
        <div style={{color:C.blue,fontWeight:900,fontSize:13,marginBottom:5}}>There is (isn't) + مفرد</div>
        <Fm text="There is + a/an + noun + place" color={C.blue}/>
        <Ex en="There is a tree in the park." ar="يوجد شجرة في الحديقة"/>
        <Ex en="There is an apple on the table." ar="يوجد تفاحة على المنضدة"/>
      </div>
      <div style={{background:"#f3e5f5",border:`2px solid ${C.purple}`,borderRadius:10,padding:11}}>
        <div style={{color:C.purple,fontWeight:900,fontSize:13,marginBottom:5}}>There are (aren't) + جمع</div>
        <Fm text="There are + plural noun + place" color={C.purple}/>
        <Ex en="There are two books in the room." ar="يوجد كتابان في الغرفة" color={C.purple}/>
        <Ex en="There are some birds on the tree." ar="يوجد بعض الطيور على الشجرة" color={C.purple}/>
      </div>
    </div>
    <Tip icon="⚠️">أدوات النفي مثل <strong>any</strong>: There ………. any shops in the mall. (are , aren't)</Tip>
    <div style={{marginTop:10}}>
      <div style={{background:C.navy,color:C.gold,fontWeight:800,padding:"6px 12px",borderRadius:"8px 8px 0 0",fontSize:12}}>✏️ تدريب</div>
      <Quiz accent={C.blue} qs={[
        {q:"There ……… a big garden behind my house.",opts:["is","are","were"],a:"is"},
        {q:"There ……… many shops in the mall.",opts:["is","are","was"],a:"are"},
        {q:"There ……… some flowers in the vase.",opts:["is","are","am"],a:"are"},
        {q:"There ……… an old book on the shelf.",opts:["is","are","were"],a:"is"},
      ]}/>
    </div>
  </Card></>);
case 1:return(<>
  <Card icon="🕐" ar="الساعة — Time" en="Telling the Time" color={C.teal}>
    {[{r:"1",t:"الساعة بالتمام",f:"It is + (number) + o'clock",ex:"5:00 → It is five o'clock | 9:00 → It is nine o'clock",c:C.green},
      {r:"2",t:"الدقائق ≤ 30 → past",f:"It is + minutes + past + hour",ex:"5:10→ten past five | 7:15→a quarter past seven | 8:30→half past eight",c:C.blue},
      {r:"3",t:"الدقائق > 30 → to",f:"It is + (60−min) + to + next hour",ex:"5:50→ten to six | 8:45→a quarter to nine",c:C.purple},
    ].map(({r,t,f,ex,c})=>(
      <div key={r} style={{background:"#fff",border:`2px solid ${c}`,borderRadius:10,overflow:"hidden",marginBottom:8}}>
        <div style={{background:c,color:"#fff",padding:"5px 11px",fontWeight:800,fontSize:12}}>📌 Rule {r} — {t}</div>
        <div style={{padding:"9px 11px"}}><Fm text={f} color={c}/>
          <div style={{direction:"ltr",fontSize:11,color:"#333"}}>{ex}</div>
        </div>
      </div>))}
    <Tip>نستخدم <strong>a quarter</strong> للربع (15 دقيقة) و <strong>half</strong> للنصف (30 دقيقة)</Tip>
    <div style={{marginTop:9}}>
      <div style={{background:C.navy,color:C.gold,fontWeight:800,padding:"6px 12px",borderRadius:"8px 8px 0 0",fontSize:12}}>🕐 تدريب</div>
      <Quiz accent={C.teal} qs={[
        {q:"12:00 = ?",opts:["It is twelve o'clock","half past twelve","twelve past zero"],a:"It is twelve o'clock"},
        {q:"6:30 = ?",opts:["It is half past six","thirty to six","It is six thirty"],a:"It is half past six"},
        {q:"4:15 = ?",opts:["a quarter past four","fifteen to four","four and quarter"],a:"a quarter past four"},
        {q:"10:45 = ?",opts:["a quarter to eleven","It is ten forty-five","forty-five past ten"],a:"a quarter to eleven"},
        {q:"11:50 = ?",opts:["It is ten to twelve","fifty past eleven","It is eleven fifty"],a:"It is ten to twelve"},
      ]}/>
    </div>
  </Card></>);
case 2:return(<>
  <Card icon="⏱️" ar="المضارع المستمر" en="Present Continuous" color={C.blue}>
    <div style={{background:"#e8f5e9",border:`2px solid ${C.green}`,borderRadius:8,padding:"7px 11px",direction:"ltr",marginBottom:10}}>
      <span style={{fontWeight:800,color:C.green}}>🔑 Signals: </span>
      <span style={{fontWeight:600,fontSize:12}}>now, at the moment, at the present time, today, look!, listen!</span>
    </div>
    <G3 items={[
      {label:"✅ إثبات",val:"am/is/are + verb-ing",bg:"#e8f5e9",bc:C.green},
      {label:"❌ نفي",val:"am/is/are + not + v-ing",bg:"#ffebee",bc:C.red},
      {label:"❓ سؤال",val:"Am/Is/Are + sub + v-ing?",bg:"#e3f2fd",bc:C.blue},
    ]}/>
    <Tbl cols={["الضمير","المساعد","مثال"]} colColors={[C.navy,C.blue,C.teal]}
      rows={[["I","am","I am writing a letter today."],
        ["He/She/It","is","She is cooking lunch now."],
        ["They/We/You","are","They are studying at the moment."]]}/>
    <div style={{background:"#fff9c4",borderRadius:9,padding:10,border:`2px solid #f9a825`,marginTop:9}}>
      <div style={{fontWeight:800,color:C.navy,marginBottom:6,fontSize:12}}>📌 قواعد إضافة -ing</div>
      {[{n:"1",r:"الفعل العادي → أضف ing",ex:"play→playing, eat→eating",c:C.teal},
        {n:"2",r:"ينتهي بـ e → احذفها وأضف ing",ex:"come→coming, write→writing",c:C.blue},
        {n:"3",r:"صامت+علة+صامت → ضاعف الصامت",ex:"sit→sitting, stop→stopping",c:C.purple},
        {n:"4",r:"ينتهي بـ ie → y ثم ing",ex:"lie→lying, die→dying",c:C.red},
      ].map(({n,r,ex,c})=>(
        <div key={n} style={{display:"flex",gap:7,marginBottom:5,direction:"rtl",alignItems:"flex-start"}}>
          <span style={{background:c,color:"#fff",borderRadius:"50%",width:19,height:19,
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,flexShrink:0}}>{n}</span>
          <div><div style={{fontWeight:700,color:C.navy,fontSize:11}}>{r}</div>
            <div style={{fontFamily:"monospace",fontSize:10,color:c,direction:"ltr"}}>{ex}</div>
          </div>
        </div>))}
    </div>
    <div style={{marginTop:9}}>
      <div style={{background:C.navy,color:C.gold,fontWeight:800,padding:"6px 12px",borderRadius:"8px 8px 0 0",fontSize:12}}>✏️ تدريب</div>
      <Quiz accent={C.blue} qs={[
        {q:"She ……… (do) the homework today.",opts:["is doing","are doing","was doing"],a:"is doing"},
        {q:"swim → -ing form?",opts:["swiming","swimming","swimm"],a:"swimming"},
        {q:"drive → -ing form?",opts:["driveing","driving","drived"],a:"driving"},
        {q:"lie → -ing form?",opts:["lieing","lying","lied"],a:"lying"},
      ]}/>
    </div>
  </Card></>);
case 3:return(<>
  <Card icon="🕰️" ar="الماضي المستمر" en="Past Continuous" color={C.purple}>
    <div style={{background:"#f3e5f5",border:`2px solid ${C.purple}`,borderRadius:8,padding:"7px 11px",direction:"ltr",marginBottom:10}}>
      <span style={{fontWeight:800,color:C.purple}}>🔑 Signals: </span>
      <span style={{fontWeight:600,fontSize:12}}>when, while, at + past time, all day yesterday</span>
    </div>
    <G3 items={[
      {label:"✅ إثبات",val:"was/were + verb-ing",bg:"#e8f5e9",bc:C.green},
      {label:"❌ نفي",val:"wasn't/weren't + v-ing",bg:"#ffebee",bc:C.red},
      {label:"❓ سؤال",val:"Was/Were + sub + v-ing?",bg:"#f3e5f5",bc:C.purple},
    ]}/>
    <Tbl cols={["الضمير","was/were","مثال"]} colColors={[C.purple,C.blue,C.teal]}
      rows={[["She/He/It/I","was","She was reading a book."],
        ["They/We/You","were","They were watching TV at 8."]]}/>
    <Ex en="She was reading when he called." ar="كانت تقرأ عندما اتصل — ماضي مستمر + بسيط" color={C.purple}/>
    <Ex en="Jack wasn't writing the lesson in his notebook." ar="لم يكن جاك يكتب الدرس" color={C.red}/>
    <div style={{marginTop:9}}>
      <div style={{background:C.navy,color:C.gold,fontWeight:800,padding:"6px 12px",borderRadius:"8px 8px 0 0",fontSize:12}}>✏️ تدريب</div>
      <Quiz accent={C.purple} qs={[
        {q:"She ……… a book when I arrived.",opts:["was reading","is reading","reads"],a:"was reading"},
        {q:"Tarek ……… (not write) the lesson.",opts:["wasn't writing","weren't writing","isn't writing"],a:"wasn't writing"},
        {q:"They ……… TV at 8 o'clock.",opts:["were watching","was watching","are watching"],a:"were watching"},
      ]}/>
    </div>
  </Card></>);
case 4:return(<>
  <Card icon="🚗" ar="سيارة السنة P.7" en="Car of the Year" color={C.red}>
    <Tbl cols={["الخاصية","التفاصيل"]} colColors={[C.red,C.navy]} rows={[
      ["Name","Panther"],["Seats","8 people"],["Km/litre","12 km"],
      ["Safety","Airbags + many features"],["Extras","CDs, sunroof, CD Player, tinted windows"]]}/>
    <div style={{marginTop:10}}>
      {[{s:`Car of the year is called "Panther 4x4".`,a:"T",n:"صحيح"},
        {s:"Some young men are not interested in its engine.",a:"F",n:"خطأ — هم مهتمون جداً"},
        {s:"Panther has NO standard features.",a:"F",n:"خطأ — لديها ميزات قياسية"},
        {s:`There's loads of space inside "Panther 3000".`,a:"T",n:"صحيح"},

// ══ MAIN APP ════════════════════════════════════════════════════════════════
function App(){
  const [unitIdx,setUnitIdx]=useState(0);
  const [tab,setTab]=useState(0);
  const [done,setDone]=useState({});

  const unit=UNITS[unitIdx];
  const sections=UNIT_TABS[unitIdx];
  const totalSec=UNIT_TABS.reduce((s,u)=>s+u.length,0);
  const doneCount=Object.keys(done).length;

  const mark=()=>{
    const key=`${unitIdx}-${tab}`;
    if(!done[key])setDone(d=>({...d,[key]:true}));
    if(tab<sections.length-1)setTab(t=>t+1);
    else if(unitIdx<UNITS.length-1){setUnitIdx(u=>u+1);setTab(0);}
  };

  const renderSection=()=>{
    if(unitIdx===0)return React.createElement(RenderU1,{tab});
    if(unitIdx===1)return React.createElement(RenderU2,{tab});
    if(unitIdx===2)return React.createElement(RenderU3,{tab});
    if(unitIdx===3)return React.createElement(RenderU4,{tab});
    if(unitIdx===4)return React.createElement(RenderU5,{tab});
    if(unitIdx===5)return React.createElement(RenderU6,{tab});
    return null;
  };

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#0d1b4e 0%,#1a3a8f 40%,#0096c7 100%)",
      fontFamily:"'Segoe UI',Tahoma,sans-serif",direction:"rtl"}}>

      {/* HEADER */}
      <div style={{background:"linear-gradient(90deg,#ffd60a,#f4811f)",
        padding:"11px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{color:C.navy,fontWeight:900,fontSize:17}}>📚 المراجعة الشاملة للغة الإنجليزية</div>
          <div style={{color:C.navy,fontSize:11,fontWeight:600}}>English Mastery Toolkit — Units 1–6 | الصف الثالث المتوسط</div>
        </div>
        <div style={{textAlign:"left"}}>
          <div style={{color:C.navy,fontSize:11,fontWeight:700}}>{AUTHOR}</div>
          <div style={{background:C.navy,color:C.gold,borderRadius:16,padding:"2px 10px",fontSize:11,fontWeight:800,marginTop:2}}>
            {doneCount}/{totalSec} مكتمل
          </div>
        </div>
      </div>

      {/* PROGRESS */}
      <div style={{background:"rgba(255,255,255,.15)",height:5}}>
        <div style={{height:"100%",background:C.gold,width:`${(doneCount/totalSec)*100}%`,transition:"width .5s",borderRadius:3}}/>
      </div>

      {/* UNIT TABS */}
      <div style={{display:"flex",overflowX:"auto",gap:3,padding:"8px 12px 0",background:"rgba(0,0,0,.25)"}}>
        {UNITS.map((u,i)=>(
          <button key={u.id} onClick={()=>{setUnitIdx(i);setTab(0);}} style={{
            padding:"7px 14px",border:"none",borderRadius:"10px 10px 0 0",
            background:unitIdx===i?u.color:"rgba(255,255,255,.12)",
            color:unitIdx===i?"#fff":"rgba(255,255,255,.7)",
            fontWeight:800,fontSize:12,cursor:"pointer",whiteSpace:"nowrap",transition:"all .15s",
            borderBottom:unitIdx===i?`3px solid ${C.gold}`:"3px solid transparent"}}>
            {u.label}
          </button>))}
      </div>

      {/* SECTION TABS */}
      <div style={{display:"flex",overflowX:"auto",gap:4,padding:"6px 12px",background:"rgba(0,0,0,.15)"}}>
        {sections.map((s,i)=>(
          <button key={i} onClick={()=>setTab(i)} style={{
            padding:"5px 12px",borderRadius:16,border:"none",
            background:tab===i?unit.color:"rgba(255,255,255,.13)",
            color:tab===i?"#fff":"rgba(255,255,255,.7)",
            fontWeight:700,fontSize:11,cursor:"pointer",whiteSpace:"nowrap",transition:"all .15s",
            display:"flex",alignItems:"center",gap:3}}>
            {s.icon} {s.label}
            {done[`${unitIdx}-${i}`]&&<span style={{fontSize:9}}>✅</span>}
          </button>))}
      </div>

      {/* UNIT TITLE BANNER */}
      <div style={{padding:"10px 14px 0"}}>
        <div style={{background:`linear-gradient(135deg,${unit.color},${unit.color}aa)`,
          borderRadius:12,padding:"9px 14px",display:"flex",alignItems:"center",gap:9}}>
          <span style={{fontSize:22}}>{sections[tab]?.icon}</span>
          <div>
            <div style={{color:"#fff",fontWeight:900,fontSize:15}}>{unit.label} — {sections[tab]?.label}</div>
            <div style={{color:"rgba(255,255,255,.75)",fontSize:11}}>{unit.sub}</div>
          </div>
        </div>
      </div>

      {/* CONTENT */}
      <div style={{padding:"12px 14px",maxWidth:860,margin:"0 auto"}}>
        {renderSection()}
        <button onClick={mark} style={{width:"100%",padding:"11px",borderRadius:10,border:"none",
          background:done[`${unitIdx}-${tab}`]?C.gold:unit.color,
          color:done[`${unitIdx}-${tab}`]?C.navy:"#fff",
          fontWeight:800,fontSize:13,cursor:"pointer",marginTop:4}}>
          {done[`${unitIdx}-${tab}`]
            ?(tab<sections.length-1?"← القسم التالي":unitIdx<UNITS.length-1?"← الوحدة التالية":"🏆 أتممت جميع الوحدات!")
            :"✅ انتهيت من هذا القسم"}
        </button>
        <div style={{textAlign:"center",marginTop:14,color:"rgba(255,255,255,.4)",fontSize:11,paddingBottom:20}}>
          إعداد {AUTHOR} • English Mastery Toolkit • Units 1–6 • الثالث المتوسط
        </div>
      </div>
    </div>);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
